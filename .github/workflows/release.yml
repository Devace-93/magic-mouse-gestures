# Builds release artifacts when a tag like v0.1.0 is pushed:
#   - static binaries (musl) for x86_64 and aarch64, as tarballs
#   - .deb (Debian/Ubuntu/Pop!_OS) and .rpm (Fedora/openSUSE) packages
#   - SHA256SUMS
#   - a Homebrew formula pointing at the tarballs (also pushed to the tap
#     repository when the HOMEBREW_TAP_TOKEN secret is set)
# The version comes from Cargo.toml and must match the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml says $version but the tag is $tag" >&2
            exit 1
          fi

      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Package
        run: |
          set -eu
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p target/release dist
          cp target/${{ matrix.target }}/release/magic-mouse-gestures target/release/magic-mouse-gestures
          # Tarball: binary + settings app + the files get.sh installs by hand.
          stage=magic-mouse-gestures-v${version}-${{ matrix.arch }}-linux
          mkdir -p "$stage"
          cp target/release/magic-mouse-gestures ui/magic-mouse-gestures-settings "$stage/"
          cp packaging/60-magic-mouse-gestures.rules packaging/magic-mouse-gestures.conf \
             packaging/magic-mouse-gestures.service packaging/org.magicmouse.Gestures.desktop \
             README.md LICENSE "$stage/"
          tar czf "dist/$stage.tar.gz" "$stage"
          # Native packages (the runner's architecture matches the target).
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and Homebrew formula
        run: |
          set -eu
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          version=$(grep -m1 '^version' ../Cargo.toml | cut -d'"' -f2)
          sha_x86=$(grep "x86_64-linux.tar.gz" SHA256SUMS | cut -d' ' -f1)
          sha_arm=$(grep "aarch64-linux.tar.gz" SHA256SUMS | cut -d' ' -f1)
          sed -e "s/@VERSION@/$version/g" -e "s/@SHA_X86_64@/$sha_x86/g" -e "s/@SHA_AARCH64@/$sha_arm/g" \
              ../packaging/homebrew/magic-mouse-gestures.rb.in > magic-mouse-gestures.rb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Devace-93/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp artifacts/magic-mouse-gestures.rb tap/Formula/magic-mouse-gestures.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/magic-mouse-gestures.rb
          git commit -m "magic-mouse-gestures ${GITHUB_REF_NAME}" || echo "formula unchanged"
          git push
