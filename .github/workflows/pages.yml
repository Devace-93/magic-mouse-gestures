# Publishes site/ (the landing page at https://mouse.3m4.net) to GitHub Pages.
# Runs on every push to main that touches the site, and on demand from any
# branch (Actions tab -> "Pages" -> Run workflow) to publish a preview branch.
name: Pages

on:
  push:
    # `landing-page` is a bootstrap trigger so the site is live before the
    # branch reaches main (main is protected, so the workflow could not be
    # registered there first). Drop it once this file is on main.
    branches: [main, landing-page]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
