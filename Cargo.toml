[package]
name = "magic-mouse-gestures"
version = "0.1.0"
edition = "2021"
description = "Userspace driver that turns Apple Magic Mouse multitouch into native desktop gestures (workspace swipes, taps) on Linux/Wayland."
license = "MIT"

[dependencies]
anyhow = "1"
evdev = { version = "0.13", features = ["serde"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Focused-window tracking for per-application rules (Wayland toplevel protocols).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", features = ["client"] }

[profile.release]
opt-level = 2
lto = true
strip = true
