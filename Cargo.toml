[package]
name = "mousetouch"
version = "0.1.1"
edition = "2021"
description = "Apple Magic Mouse multitouch gestures (workspace swipes, pinch, taps) for Linux/Wayland"
license = "MIT"
repository = "https://github.com/Devace-93/mousetouch"
homepage = "https://mouse.3m4.net"
readme = "README.md"
keywords = ["magic-mouse", "gestures", "wayland", "evdev", "uinput"]
categories = ["hardware-support", "os::linux-apis"]
exclude = ["target/", ".github/", "packaging/homebrew/", "packaging/aur/", "packaging/rpm/", "flake.nix", "get.sh"]

[dependencies]
anyhow = "1"
evdev = { version = "0.13", features = ["serde"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# Focused-window tracking for per-application rules (Wayland toplevel protocols).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", features = ["client"] }

[profile.release]
opt-level = 2
lto = true
strip = true

# `cargo deb` (Debian/Ubuntu/Pop!_OS package). The binary is built statically
# (musl), so the daemon itself has no runtime dependencies; the settings app
# is optional and pulls GTK4/libadwaita through Recommends.
[package.metadata.deb]
maintainer = "Enrique Magallon <dev.ace.93.03@gmail.com>"
copyright = "2026, Enrique Magallon"
extended-description = """Userspace driver for the Apple Magic Mouse on Linux/Wayland. Decodes the
mouse's multitouch reports and replays them as touchpad gestures the desktop
already understands: two-finger swipes switch workspaces with the native
animation, pinch zooms, taps run configurable actions, and one-finger
scrolling is shaped to start cleanly. Includes an optional GTK settings app."""
section = "utils"
priority = "optional"
depends = "udev, systemd"
recommends = "python3-gi, python3-gi-cairo, gir1.2-gtk-4.0, gir1.2-adw-1"
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/mousetouch", "usr/bin/", "755"],
    ["ui/mousetouch-settings", "usr/bin/", "755"],
    ["packaging/io.github.Devace_93.MouseTouch.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.Devace_93.MouseTouch.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/60-mousetouch.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/mousetouch.conf", "usr/lib/modules-load.d/", "644"],
    ["packaging/mousetouch.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/mousetouch/", "644"],
]

# `cargo generate-rpm` (Fedora/openSUSE package from the same binary).
[package.metadata.generate-rpm]
summary = "Apple Magic Mouse multitouch gestures for Linux/Wayland"
license = "MIT"
url = "https://github.com/Devace-93/mousetouch"
post_install_script = "udevadm control --reload-rules || true; udevadm trigger --subsystem-match=input --subsystem-match=misc || true; modprobe uinput || true; systemctl --global enable mousetouch.service || true"
pre_uninstall_script = "if [ $1 -eq 0 ]; then systemctl --global disable mousetouch.service || true; fi"
assets = [
    { source = "target/release/mousetouch", dest = "/usr/bin/mousetouch", mode = "755" },
    { source = "ui/mousetouch-settings", dest = "/usr/bin/mousetouch-settings", mode = "755" },
    { source = "packaging/io.github.Devace_93.MouseTouch.desktop", dest = "/usr/share/applications/io.github.Devace_93.MouseTouch.desktop", mode = "644" },
    { source = "packaging/io.github.Devace_93.MouseTouch.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.Devace_93.MouseTouch.svg", mode = "644" },
    { source = "packaging/60-mousetouch.rules", dest = "/usr/lib/udev/rules.d/60-mousetouch.rules", mode = "644" },
    { source = "packaging/mousetouch.conf", dest = "/usr/lib/modules-load.d/mousetouch.conf", mode = "644" },
    { source = "packaging/mousetouch.service", dest = "/usr/lib/systemd/user/mousetouch.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mousetouch/README.md", mode = "644", doc = true },
]
[package.metadata.generate-rpm.requires]
systemd = "*"
