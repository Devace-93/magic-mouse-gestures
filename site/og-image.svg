<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121420"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f8"/>
      <stop offset="1" stop-color="#d6d6de"/>
    </linearGradient>
    <linearGradient id="touch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2f7ff0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f7ff0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f7ff0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- mouse -->
  <g transform="translate(150 95)">
    <rect x="6" y="8" width="208" height="440" rx="104" fill="#000" opacity="0.35"/>
    <rect x="0" y="0" width="208" height="440" rx="104" fill="url(#body)" stroke="#303036" stroke-width="10"/>
    <path d="M52 150c22-40 82-40 104 0" fill="none" stroke="url(#touch)" stroke-width="18" stroke-linecap="round"/>
    <path d="M62 222c17-30 67-30 84 0" fill="none" stroke="url(#touch)" stroke-width="18" stroke-linecap="round"/>
    <path d="M76 292c11-17 45-17 56 0" fill="none" stroke="url(#touch)" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- text -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Cantarell, 'Noto Sans', sans-serif" fill="#ececf1">
    <text x="440" y="235" font-size="92" font-weight="800" letter-spacing="-2">MouseTouch</text>
    <text x="442" y="310" font-size="38" font-weight="600" fill="#a0a0ad">Multitouch gestures for the</text>
    <text x="442" y="360" font-size="38" font-weight="600" fill="#a0a0ad">Magic Mouse on Linux</text>
    <g font-size="24" font-weight="600" fill="#ececf1">
      <rect x="442" y="402" width="172" height="46" rx="23" fill="#1b1e27" stroke="#2a2b33"/>
      <text x="528" y="433" text-anchor="middle">Wayland</text>
      <rect x="628" y="402" width="384" height="46" rx="23" fill="#1b1e27" stroke="#2a2b33"/>
      <text x="820" y="433" text-anchor="middle">COSMIC · GNOME · KDE · niri</text>
    </g>
    <text x="442" y="530" font-size="30" font-weight="600" fill="#5b9bff">mouse.3m4.net</text>
  </g>
</svg>
